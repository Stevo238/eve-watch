name: Build binaries

on:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build
        run: pyinstaller --onefile --name eve-watch-linux --hidden-import PIL._tkinter_finder --hidden-import PIL.ImageTk app.py

      - name: Smoke test (launch under virtual display)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          xvfb-run -a ./dist/eve-watch-linux &
          APP_PID=$!
          sleep 12
          if kill -0 $APP_PID 2>/dev/null; then
            echo "App launched and stayed running"
            kill $APP_PID
          else
            echo "App exited early — build is broken"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: eve-watch-linux
          path: dist/eve-watch-linux

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build
        run: pyinstaller --onefile --windowed --name eve-watch-windows --hidden-import PIL._tkinter_finder --hidden-import PIL.ImageTk app.py

      - name: Smoke test (launch and verify it stays running)
        shell: powershell
        run: |
          $p = Start-Process -FilePath "dist\eve-watch-windows.exe" -PassThru
          Start-Sleep -Seconds 12
          if (-not $p.HasExited) {
            Write-Host "App launched and stayed running"
            Stop-Process -Id $p.Id -Force
          } else {
            Write-Host "App exited early - build is broken (exit code $($p.ExitCode))"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: eve-watch-windows
          path: dist/eve-watch-windows.exe
