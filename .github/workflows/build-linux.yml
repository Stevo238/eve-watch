name: Build Linux binary

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build
        run: pyinstaller --onefile --name eve-watch-linux --hidden-import PIL._tkinter_finder --hidden-import PIL.ImageTk app.py

      - name: Smoke test (launch under virtual display)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          xvfb-run -a ./dist/eve-watch-linux &
          APP_PID=$!
          sleep 12
          if kill -0 $APP_PID 2>/dev/null; then
            echo "App launched and stayed running"
            kill $APP_PID
          else
            echo "App exited early — build is broken"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: eve-watch-linux
          path: dist/eve-watch-linux
